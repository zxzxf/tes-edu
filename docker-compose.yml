# Tes Edu 一体化编排（开发/演示用）
# 启动： docker compose up --build
# 网关 :8080 对外；agent-backend / web-backend 仅内网可达。
# postgres / kafka 为数据层底座；当前后端为占位实现，未强制依赖，可独立启动。

services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY:?请配置 RS256 公钥（见 README 密钥生成章节）}"
      AGENT_BACKEND_URL: "http://agent-backend:8000"
      WEB_BACKEND_URL: "http://web-backend:8001"
      RATE_LIMIT: "20"
    depends_on:
      - agent-backend
      - web-backend

  agent-backend:
    build: ./agent-backend
    expose:
      - "8000"
    environment:
      PORT: "8000"

  web-backend:
    build: ./web-backend
    expose:
      - "8001"
    environment:
      PORT: "8001"
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:?请配置 RS256 私钥（见 README 密钥生成章节）}"

  web-frontend:
    build: ./web-frontend
    ports:
      - "8081:80"
    depends_on:
      - gateway

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tes
      POSTGRES_PASSWORD: tes123
      POSTGRES_DB: tes_edu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/bitnami/kafka

volumes:
  pgdata:
  kafkadata:
