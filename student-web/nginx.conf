server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：刷新/直接访问子路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Go 网关（容器内用服务名互访）。
    # 生产实际链路：浏览器 -> edu-lb `location /` -> 网关；
    # 此处保证直连本容器（8082）时 /api /login /learning 也能调到后端。
    # 变量 proxy_pass + Docker 内置 DNS resolver：对网关重建/扩缩容免疫。
    location /api {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gw http://gateway:8080;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /login {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gw http://gateway:8080;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /learning {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gw http://gateway:8080;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
