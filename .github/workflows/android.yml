name: Android CI

# T-E3 正式验收门禁：在学生端 App 改动时跑「单元测试 + Debug APK 编译」，
# 全绿即视为 Android 真机验证等价项（替代真机装包全链路）。
on:
  push:
    branches: [main]
    paths:
      - "student-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "student-app/**"
      - ".github/workflows/android.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform-34 / build-tools 34.0.0)
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configure local.properties (sdk.dir from ANDROID_HOME)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (SolveViewModelTest etc.)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK (compile gate)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
