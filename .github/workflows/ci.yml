name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run import-pipeline tests (no DB required)
        run: pytest tests/ -q
      # M2-8 聚合口径门禁：把 gold set 判分准确率量化并设阈值。
      # 阈值按方案书口径 —— 首月 0.95（观察期）/ 稳定期 0.98；可用仓库变量覆盖。
      # 红线仍由上面的 pytest 逐例强约束，本步是「聚合准确率 + 失败清单可见」的第二层。
      # if: always() 保证 pytest 变红时这一步仍执行，从而把准确率与失败清单写进 Summary。
      - name: Gold set accuracy gate (M2-8)
        if: always()
        env:
          GOLD_SET_MIN_ACCURACY: "0.98"
        run: python tests/gold_set_gate.py

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps (pure-python, no DB/ACR required)
        run: pip install pytest "pydantic>=2.6" "pydantic-settings" "python-jose[cryptography]==3.3.0" "fastapi==0.110.0" "sqlalchemy==2.0.30" cryptography pgvector==0.5.1
      - name: Run core-logic tests (no DB required)
        run: pytest tests/ -q
