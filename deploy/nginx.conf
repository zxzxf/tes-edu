worker_processes auto;
events {
    # 调高连接上限：改用上游 keepalive 长连接后，单 worker 常驻连接数 =
    # 客户端连接 + 上游长连接，1024 在高并发（c≥400）下会成为瓶颈。
    worker_connections 4096;
}

http {
    # 网关上游：静态 upstream + keepalive 长连接复用。
    #
    # 历史方案（resolver 127.0.0.11 + 变量 proxy_pass）的问题——137 压测实测：
    # nginx 的变量 proxy_pass 会禁用上游连接复用，每个请求都新建 TCP 连接
    # 连 gateway，链路吞吐被压在 ~10.4k QPS；且并发 ≥400 时因连接建立过快
    # （系统 tcp_tw_reuse=0、临时端口仅 28k）出现
    # "upstream timed out while connecting to upstream"（连接建立超时，
    # 表现为延迟劣化到秒级、偶发 504）。同条件对照实验：静态 upstream
    # + keepalive 可达 16k+ QPS，且 c=400 零错误零超时。
    #
    # 服务名 gateway 由 Docker 内置 DNS 在 nginx 启动时解析，多副本的 A 记录
    # 会全部加入轮询组，保持跨副本负载均衡。
    # 局限：副本重建后容器 IP 变化不会被自动感知——扩容/缩容/重启副本后
    # 需要 reload 本配置才能刷新上游地址：
    #   docker kill -s HUP edu-lb
    upstream gateway_pool {
        server gateway:8080;
        keepalive 64;
    }

    # 上游不可达时快速失败，避免长时间挂起
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    server {
        listen 80;
        server_name _;

        # 运维端点不对外暴露：/metricsz、/licensez 设计为仅本机/内网访问，
        # 但请求经本 lb 转发后，网关看到的源 IP 是 lb 的私网容器地址
        # （isLocalRequest 判私网放行），等于把运维数据经 cloudflared 隧道
        # 暴露给公网。在入口层直接拒绝（精确匹配优先于 location /），纵深防御。
        location = /metricsz { return 403; }
        location = /licensez { return 403; }

        # B 端管理后台（T-E1 2026-10-24）：/admin/ 剥前缀反代到前端容器。
        # 前缀匹配长于 location / 故优先；精确匹配 = /admin 做一次跳转补尾斜杠。
        # 前端容器内按根路径服务（root + try_files SPA 回退），故 proxy_pass
        # 带 "/" 把 /admin 剥掉再转发：/admin/assets/x.js -> /assets/x.js。
        # 页面 API（/api/admin/*）走下方 location / 到网关，不经前端容器。
        location = /admin { return 301 /admin/; }
        location /admin/ {
            proxy_pass http://web-front:80/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 学生网页端（T-S0，2026-10-26）：/student/ 剥前缀反代到 student-web 容器。
        # 与 /admin/ 同款范式；API（/login、/learning/、/api/student/）走下方
        # location / 到网关，不经本前端容器。
        # 注：网关 config.yaml 只管 API 路由（/login、/learning/ 等已为 jwt_c C 端态），
        # 静态由 edu-lb 按前缀剥离服务，故此处加静态路由、不改网关。
        location = /student { return 301 /student/; }
        location /student/ {
            proxy_pass http://student-web:80/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://gateway_pool;

            # keepalive 回源：HTTP/1.1 + 清空 Connection 头，连接池中的
            # 长连接可被后续请求复用（proxy_http_version 1.1 是前提）。
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # LLM 长耗时路由单独放宽读超时（2026-10-27）。
        # ⚠️ 上面全局 proxy_read_timeout 30s 是压测调出来的「快速失败」保护，
        # 不能整体放大（否则上游挂死时连接会长时间悬挂）。但 /api/app/ 是 App
        # 的解题/触类旁通入口，agent 要跑 RAG 检索 + LLM 生成，实测：
        #   简单题（guide 档）25.8s、复杂题（explain 档）62.6s —— 30s 必 504，
        # 表现为「App 一点稍难的题就失败」，而 agent 侧只看到 context canceled。
        # 前缀匹配长于 location / 故优先，只影响这一条路由。
        # 上游 keepalive 与请求头沿用 location / 的口径（否则回源连接无法复用，
        # 高并发下会退化成每请求新建 TCP，参见文件头 upstream 的历史方案说明）。
        location /api/app/ {
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 3s;
            proxy_read_timeout 180s;
            proxy_send_timeout 60s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
