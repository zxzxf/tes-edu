# 课程教育 Agent 系统 —— 网关生产编排（多副本 + Redis 全局限流）
#
# 部署目录（137）：/opt/tes-edu-gateway/
# 用法：
#   mkdir -p /opt/tes-edu-gateway/gateway /opt/tes-edu-web-front
#   # 把本仓库 gateway/ 源码同步到 /opt/tes-edu-gateway/gateway/
#   # 把本仓库 web-frontend/ 源码同步到 /opt/tes-edu-web-front/（含 Dockerfile/nginx.conf）
#   # 把本文件放到 /opt/tes-edu-gateway/docker-compose.yml
#   # 把 nginx.conf 放到 /opt/tes-edu-gateway/nginx.conf
#   JWT_PUBLIC_KEY=<RSA公钥(PEM)> REDIS_PASSWORD=<强密码> \
#   JWT_PRIVATE_KEY=<RSA私钥(PEM)> \
#     docker compose up -d --build --scale gateway=2
#
# 说明：
#   - lb (nginx)   : 持有宿主机 :80（cloudflared 隧道入口），按请求轮询到各 gateway 副本
#   - gateway (×N) : 自建 Go 轻网关，唯一业务入口；REDIS_ENABLED=true 指向同一 edu-redis，
#                    多副本共享同一令牌桶 → 全局限流一致
#   - redis        : 限流用的 Redis（多副本全局令牌桶），仅绑定内网 10.0.0.5:6379，公网不可达
#   - agent-backend : 真实 Agent 后端（RAG + LLM + 判分），镜像 edu-agent-backend:real
#   - web-backend   : 真实 Web 后端（知识点/错题/批改/合规/学情落库），镜像 edu-web-backend:real
#     （2026-10-23 起两个后端均已由 mock 桩替换为真实实现）
#   - web-front     : B 端 Web 管理后台前端（Vue3 + nginx），镜像 edu-web-front:real
#     （2026-10-24 T-E1 上线；经 lb 的 location /admin/ 剥前缀反代到本容器，
#       vite base 与 router base 均为 /admin/；页面 API 走 /api/admin/* 不经本容器）
#
# 扩容：--scale gateway=N（需先 docker compose up 一次生成网络/卷）

services:
  lb:
    image: nginx:1.27-alpine
    container_name: edu-lb
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - edu-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: registry.cn-shanghai.aliyuncs.com/mis_ser/edu-gateway:latest
    # 多副本：docker compose up -d --scale gateway=2
    environment:
      CONFIG_PATH: /app/config.yaml
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY:?请通过环境变量 JWT_PUBLIC_KEY 传入 RSA 公钥(PEM)}"
      GATEWAY_LOG: /var/log/gateway/access.log
      REDIS_ENABLED: "true"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请通过环境变量 REDIS_PASSWORD 设置强密码}"
    volumes:
      - gateway-log:/var/log/gateway
    depends_on:
      redis:
        condition: service_healthy
      agent-backend:
        condition: service_started
      web-backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - edu-net

  redis:
    image: redis:7-alpine
    container_name: edu-redis
    # 命令行 --requirepass 优先级高于 redis.conf，确保 REDIS_PASSWORD 生效
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?请通过环境变量 REDIS_PASSWORD 设置强密码}"]
    # 仅绑定宿主机私有 IP，公网不可达（defense in depth）；同网络仍可用 redis:6379 访问
    ports:
      - "10.0.0.5:6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?请通过环境变量 REDIS_PASSWORD 设置强密码}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - edu-net

  agent-backend:
    # 真实 Agent 后端（FastAPI）：RAG(106 pgvector) + LLM(千问) + 变式题
    # 2026-10-23 替换原 edu-mock-backend 桩；回滚见 docker-compose.yml.bak.20261023-013139
    image: edu-agent-backend:real
    container_name: edu-agent-backend
    # 仅内网可达，不映射宿主机端口
    expose:
      - "8000"
    restart: unless-stopped
    env_file:
      - ./agent-backend.env
    networks:
      - edu-net

  web-backend:
    # 真实 Web 后端（FastAPI）：知识点/错题/批改/合规已落库（106 PostgreSQL）
    # 2026-10-23 替换原 edu-mock-backend 桩；回滚见 docker-compose.yml.bak.*
    image: edu-web-backend:real
    container_name: edu-web-backend
    # 仅内网可达；端口必须与网关上游 http://web-backend:8000 一致
    expose:
      - "8000"
    restart: unless-stopped
    env_file:
      - ./web-backend.env
    environment:
      # T-B5 /login 签发 RS256 令牌用；私钥对应网关 JWT_PUBLIC_KEY（secrets/jwt_private.pem）。
      # 多行 PEM 不能进 env_file，经 compose 变量 substitution 注入（2026-10-24 接线）。
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:?请通过环境变量注入 web-backend 的 RS256 私钥 PEM}"
      # T-AM6：MCP 厂商/实例凭证加密密钥（32 字节 hex/base64）。实际取值放
      # ./web-backend.env（env_file）；此处 substitution 仅作兜底默认空串，
      # 留空时后端从 JWT_PRIVATE_KEY 派生并告警（仅限开发联调）。
      VENDOR_CREDENTIAL_KEY: "${VENDOR_CREDENTIAL_KEY:-}"
    networks:
      - edu-net


  web-front:
    # B 端 Web 管理后台前端（Vue3 + Vite，nginx 静态托管）——T-E1 2026-10-24 上线
    # 暴露方式：edu-lb 的 location /admin/ 剥前缀反代到本容器 80（vite base 与
    # router base 均为 /admin/，地址栏/资源引用/路由链接带前缀，容器内按根服务）。
    # 页面 API 走 /api/admin/*（lb location / -> 网关 -> web-backend），不经本容器。
    image: edu-web-front:real
    container_name: edu-web-front
    restart: unless-stopped
    networks:
      - edu-net
    expose:
      - "80"

volumes:
  gateway-log:
  redis-data:

networks:
  edu-net:
    driver: bridge
