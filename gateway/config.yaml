listen: ":8080"
upstreams:
  agent_backend: "http://agent-backend:8000"
  web_backend: "http://web-backend:8000"
# 熔断配置（按上游维度，多路由共享）。未列出的上游默认启用：
# threshold=5（连续 5 次 5xx/代理错误后打开）、cooldown=10s。
# 打开期间直接返回 503 + Retry-After，不打上游；冷却后放行单个探测请求。
breakers:
  agent_backend:
    enabled: true
    failure_threshold: 5
    cooldown_seconds: 10
  web_backend:
    enabled: true
    failure_threshold: 5
    cooldown_seconds: 10
# LLM 模型 endpoint 白名单（P5 合同硬要求：仅接受 OpenAI 兼容 /v1 接口，
# 白名单外 endpoint 由网关拒绝）。
# 契约：agent-backend 在 LLM 绑定请求头 X-LLM-Endpoint 声明目标端点，
#       网关按 scheme+host:port+路径前缀 校验；未带该头的请求默认放行。
# fail-closed：启用后若 endpoints 为空，任何带端点头的请求都会被 403——
#              P5 灌入合同锁定的 endpoint 之前，宁可拒绝也不放行。
# 环境变量覆盖：LLM_ALLOWLIST_ENABLED / LLM_ALLOWLIST_HEADER / LLM_ALLOWLIST_REQUIRE_HEADER
llm_allowlist:
  enabled: true
  header: "X-LLM-Endpoint"
  require_header: false
  endpoints: []
  # P5 定稿后按合同填入（示例）：
  # endpoints:
  #   - "https://api.deepseek.com/v1"        # H 档强推理
  #   - "https://dashscope.aliyuncs.com/compatible-mode/v1"  # Qwen OpenAI 兼容
  #   - "http://qwen32b.school.internal:8000/v1"             # L 档校内
routes:
  - match: "/api/app/"
    upstream: agent_backend
    mode: jwt_c
    rate: 20
    burst: 40
  - match: "/api/admin/"
    upstream: web_backend
    mode: rbac
    roles: ["admin", "teacher", "researcher", "operator"]
    rate: 10
    burst: 20
  - match: "/"
    upstream: agent_backend
    mode: ""
    rate: 100
    burst: 200

# 限流用的 Redis（多副本全局令牌桶）。enabled=false 时使用进程内本地桶（仅单副本一致）。
# 多副本部署请把 enabled 设为 true，并确保所有网关副本指向同一 Redis 实例。
# 也可通过环境变量 REDIS_ENABLED/REDIS_ADDR/REDIS_PASSWORD/REDIS_DB/REDIS_KEY_PREFIX 覆盖。
redis:
  enabled: true
  addr: "redis:6379"
  password: ""
  db: 0
  key_prefix: "gw:rl:"
  dial_timeout_ms: 1000
  read_timeout_ms: 200
  write_timeout_ms: 200
