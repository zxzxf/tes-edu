listen: ":8080"
upstreams:
  backend: "http://backend:8000"
routes:
  - match: "/api/app/"
    upstream: backend
    mode: jwt_c
    rate: 20
    burst: 40
  - match: "/api/admin/"
    upstream: backend
    mode: rbac
    roles: ["admin", "teacher", "researcher", "operator"]
    rate: 10
    burst: 20
  - match: "/"
    upstream: backend
    mode: ""
    rate: 100
    burst: 200
