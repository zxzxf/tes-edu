worker_processes auto;
events {
    # 调高连接上限：改用上游 keepalive 长连接后，单 worker 常驻连接数 =
    # 客户端连接 + 上游长连接，1024 在高并发（c≥400）下会成为瓶颈。
    worker_connections 4096;
}

http {
    # 网关上游：静态 upstream + keepalive 长连接复用。
    #
    # 历史方案（resolver 127.0.0.11 + 变量 proxy_pass）的问题——137 压测实测：
    # nginx 的变量 proxy_pass 会禁用上游连接复用，每个请求都新建 TCP 连接
    # 连 gateway，链路吞吐被压在 ~10.4k QPS；且并发 ≥400 时因连接建立过快
    # （系统 tcp_tw_reuse=0、临时端口仅 28k）出现
    # "upstream timed out while connecting to upstream"（连接建立超时，
    # 表现为延迟劣化到秒级、偶发 504）。同条件对照实验：静态 upstream
    # + keepalive 可达 16k+ QPS，且 c=400 零错误零超时。
    #
    # 服务名 gateway 由 Docker 内置 DNS 在 nginx 启动时解析，多副本的 A 记录
    # 会全部加入轮询组，保持跨副本负载均衡。
    # 局限：副本重建后容器 IP 变化不会被自动感知——扩容/缩容/重启副本后
    # 需要 reload 本配置才能刷新上游地址：
    #   docker kill -s HUP edu-lb
    upstream gateway_pool {
        server gateway:8080;
        keepalive 64;
    }

    # 上游不可达时快速失败，避免长时间挂起
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    server {
        listen 80;
        server_name _;

        # 运维端点不对外暴露：/metricsz、/licensez 设计为仅本机/内网访问，
        # 但请求经本 lb 转发后，网关看到的源 IP 是 lb 的私网容器地址
        # （isLocalRequest 判私网放行），等于把运维数据经 cloudflared 隧道
        # 暴露给公网。在入口层直接拒绝（精确匹配优先于 location /），纵深防御。
        location = /metricsz { return 403; }
        location = /licensez { return 403; }

        location / {
            proxy_pass http://gateway_pool;

            # keepalive 回源：HTTP/1.1 + 清空 Connection 头，连接池中的
            # 长连接可被后续请求复用（proxy_http_version 1.1 是前提）。
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
