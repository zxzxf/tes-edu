worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # Docker 内置 DNS：服务名 gateway 在多副本时解析为多个容器 IP，
    # 配合 resolver 在每次请求时重新解析，实现跨副本轮询（全局限流共享同一 Redis）。
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 上游不可达时快速失败，避免长时间挂起
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    server {
        listen 80;
        server_name _;

        # 运维端点不对外暴露：/metricsz、/licensez 设计为仅本机/内网访问，
        # 但请求经本 lb 转发后，网关看到的源 IP 是 lb 的私网容器地址
        # （isLocalRequest 判私网放行），等于把运维数据经 cloudflared 隧道
        # 暴露给公网。在入口层直接拒绝（精确匹配优先于 location /），纵深防御。
        location = /metricsz { return 403; }
        location = /licensez { return 403; }

        location / {
            set $gw "gateway:8080";
            proxy_pass http://$gw;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
