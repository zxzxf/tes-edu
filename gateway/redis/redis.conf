# 137 服务器 Redis 配置（限流专用）
#
# 本文件不写明文密码：实际 requirepass 由 docker-compose.yml 的启动命令行
#   redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
# 注入（命令行参数优先级高于本文件）。
#
# 重要：本文件不可脱离 compose 单独使用——独立启动时 Redis 将没有密码，
#       配合下面的 bind 0.0.0.0 等于裸奔。请始终通过 docker-compose.yml 启动。
bind 0.0.0.0
port 6379
protected-mode yes
# requirepass 由启动命令行注入（见上），此处不再写占位密码

# 持久化：AOF，保证重启后数据尽量不丢（限流键本身带 TTL，影响有限，但开启更稳妥）
appendonly yes
appendfsync everysec

# 内存上限与淘汰策略（限流键都带 TTL，按 LRU 淘汰即可）
maxmemory 256mb
maxmemory-policy allkeys-lru

# RDB 快照
save 900 1
save 300 10
save 60 10000
