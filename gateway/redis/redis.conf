# 137 服务器 Redis 配置（限流专用）
# 生产请把 requirepass 改为强密码，并通过 docker-compose 的 REDIS_PASSWORD 注入（已占位 changeme）
bind 0.0.0.0
port 6379
protected-mode yes
requirepass changeme

# 持久化：AOF，保证重启后数据尽量不丢（限流键本身带 TTL，影响有限，但开启更稳妥）
appendonly yes
appendfsync everysec

# 内存上限与淘汰策略（限流键都带 TTL，按 LRU 淘汰即可）
maxmemory 256mb
maxmemory-policy allkeys-lru

# RDB 快照
save 900 1
save 300 10
save 60 10000
