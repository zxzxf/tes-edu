# 课程教育 Agent 系统 —— 网关生产编排（多副本 + Redis 全局限流）
#
# 部署目录（137）：/opt/tes-edu-gateway/
# 用法：
#   mkdir -p /opt/tes-edu-gateway/gateway
#   # 把本仓库 gateway/ 源码同步到 /opt/tes-edu-gateway/gateway/
#   # 把本文件放到 /opt/tes-edu-gateway/docker-compose.yml
#   # 把 nginx.conf 放到 /opt/tes-edu-gateway/nginx.conf
#   JWT_SECRET=<强密钥> REDIS_PASSWORD=<强密码> \
#     docker compose up -d --build --scale gateway=2
#
# 说明：
#   - lb (nginx)   : 持有宿主机 :80（cloudflared 隧道入口），按请求轮询到各 gateway 副本
#   - gateway (×N) : 自建 Go 轻网关，唯一业务入口；REDIS_ENABLED=true 指向同一 edu-redis，
#                    多副本共享同一令牌桶 → 全局限流一致
#   - redis        : 限流用的 Redis（多副本全局令牌桶），仅绑定内网 10.0.0.5:6379，公网不可达
#   - agent/web backend : POC 阶段 mock，生产换成真实后端镜像
#
# 扩容：--scale gateway=N（需先 docker compose up 一次生成网络/卷）

services:
  lb:
    image: nginx:1.27-alpine
    container_name: edu-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - edu-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: registry.cn-shanghai.aliyuncs.com/mis_ser/edu-gateway:latest
    # 多副本：docker compose up -d --scale gateway=2
    environment:
      CONFIG_PATH: /app/config.yaml
      JWT_SECRET: "${JWT_SECRET:?请通过环境变量 JWT_SECRET 传入签名密钥}"
      GATEWAY_LOG: /var/log/gateway/access.log
      REDIS_ENABLED: "true"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-changeme}"
    volumes:
      - gateway-log:/var/log/gateway
    depends_on:
      redis:
        condition: service_healthy
      agent-backend:
        condition: service_started
      web-backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - edu-net

  redis:
    image: redis:7-alpine
    container_name: edu-redis
    # 命令行 --requirepass 优先级高于 redis.conf，确保 REDIS_PASSWORD 生效
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    # 仅绑定宿主机私有 IP，公网不可达（defense in depth）；同网络仍可用 redis:6379 访问
    ports:
      - "10.0.0.5:6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - edu-net

  agent-backend:
    image: registry.cn-shanghai.aliyuncs.com/mis_ser/edu-mock-backend:latest
    container_name: edu-agent-backend
    # 仅内网可达，不映射宿主机端口；POC 用 mock 承载 /api/app/*
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - edu-net

  web-backend:
    image: registry.cn-shanghai.aliyuncs.com/mis_ser/edu-mock-backend:latest
    container_name: edu-web-backend
    # 仅内网可达，不映射宿主机端口；POC 用 mock 承载 /api/admin/*
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - edu-net

volumes:
  gateway-log:
  redis-data:

networks:
  edu-net:
    driver: bridge
