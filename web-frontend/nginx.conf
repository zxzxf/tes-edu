server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：刷新/直接访问子路由时都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Go 网关（容器内用服务名互访）
    # 开发模式由 vite proxy 完成同样的事；生产统一走这里。
    # 2026-10-24（T-E1）：静态 proxy_pass 会在 nginx 启动时解析 "gateway"，
    # 容器启动早于网关（或网关重建换 IP）即 [emerg] 崩溃循环。改用 Docker 内置
    # DNS resolver + 变量 proxy_pass：启动不解析、运行期按需解析并缓存 10s，
    # 对网关重建/扩缩容免疫（前端流量小，变量方案的连接复用损失可忽略）。
    location /api {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gw http://gateway:8080;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
