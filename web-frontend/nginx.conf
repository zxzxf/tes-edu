server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容 hash 的静态资源（index-XXXXXXXX.css/js）：内容一变文件名就变，
    # 可放心长期缓存 + immutable，省掉重复下载。
    # 注：不用 expires 指令——它会另发一条 Cache-Control: max-age=... 与下面的
    # add_header 重复；统一只用 add_header，保证响应头单条、行为确定。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html 必须禁止缓存：它引用的资源名带 hash，一旦浏览器或中间层缓存了
    # 旧 html，发版后旧 html 会去请求已被新镜像删除的旧 css/js → 404、样式与
    # 脚本全丢（用户表现为「刷新了还是旧界面」，只能靠强刷绕过）。
    # 注意 edu-lb 已把 /admin/ 剥前缀，故容器内只需匹配 /index.html。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由回退：刷新/直接访问子路由时都返回 index.html
    # （内部重定向到 /index.html，会重新匹配上面的精确 location，no-cache 同样生效）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Go 网关（容器内用服务名互访）
    # 开发模式由 vite proxy 完成同样的事；生产统一走这里。
    # 2026-10-24（T-E1）：静态 proxy_pass 会在 nginx 启动时解析 "gateway"，
    # 容器启动早于网关（或网关重建换 IP）即 [emerg] 崩溃循环。改用 Docker 内置
    # DNS resolver + 变量 proxy_pass：启动不解析、运行期按需解析并缓存 10s，
    # 对网关重建/扩缩容免疫（前端流量小，变量方案的连接复用损失可忽略）。
    location /api {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gw http://gateway:8080;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
